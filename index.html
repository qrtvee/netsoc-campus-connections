<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NetSoc Campus Connections Trivia</title>
<style>
:root{--blue:rgb(5,56,82);--card:#e6f2f6;--easy:#7fd39a;--medium:#ffd166;--hard:#ff8f8f;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:95px}body{margin:0;background:var(--blue);font-family:Arial,sans-serif;color:white}.nav{position:sticky;top:0;z-index:20;background:rgba(5,56,82,.97);border-bottom:1px solid rgba(255,255,255,.18);padding:14px 20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.nav a{color:white;text-decoration:none;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:8px 15px;font-weight:700}.nav a:hover{background:white;color:var(--blue)}header{text-align:center;padding:36px 16px 15px}header h1{margin:0 0 8px;font-size:clamp(28px,5vw,48px)}header p{margin:0;opacity:.8}.topic{max-width:1400px;margin:auto;padding:32px 20px 55px}.topic h2{font-size:32px;border-bottom:2px solid rgba(255,255,255,.25);padding-bottom:10px}.columns{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.level h3{text-align:center;color:var(--blue);padding:10px;border-radius:10px;margin:0 0 14px}.easy h3{background:var(--easy)}.medium h3{background:var(--medium)}.hard h3{background:var(--hard)}.flashcard{height:230px;perspective:1000px;margin-bottom:16px;cursor:pointer}.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}.flashcard.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);color:var(--blue);border-radius:14px;padding:20px;box-shadow:0 6px 16px rgba(0,0,0,.18);overflow:auto;display:flex;flex-direction:column;justify-content:center}.back{transform:rotateY(180deg);background:#d6eaf1}.qnum{font-size:12px;font-weight:bold;opacity:.55;margin-bottom:8px}.question{font-weight:700;line-height:1.35}.choices,.answer{margin-top:12px;line-height:1.45;font-size:14px}.answer strong{font-size:16px}.hint{font-size:11px;opacity:.55;margin-top:auto;padding-top:10px;text-align:center}.face ul{padding-left:18px;margin:8px 0}.face li{margin:4px 0}@media(max-width:900px){.columns{grid-template-columns:1fr}.flashcard{height:215px}.topic{padding-left:14px;padding-right:14px}}
</style>
</head><body>
<nav class="nav"><a href="#cyber">Cyber Security</a><a href="#cloud">Cloud</a><a href="#coding">Coding</a><a href="#networking">Networking</a></nav>
<header><h1>NetSoc Trivia</h1><p>Campus Connections • Tap any card to reveal the answer</p></header>
<main id="app"></main>
<script>
const data = {
"Cyber Security": {
easy:[
["True or False: Using the same password for multiple accounts increases your risk if one account is compromised.","TRUE"],
["True or False: Phishing attacks can only happen through email.","FALSE"],
["True or False: Multi-Factor Authentication (MFA) can help protect your account even if someone learns your password.","TRUE"],
["True or False: A website using HTTPS means that everything on the website is trustworthy and safe.","FALSE"]],
medium:[
["What is the main purpose of Multi-Factor Authentication (MFA)?<div class='choices'>a. To make your password stronger<br>b. To require more than one method of verifying your identity<br>c. To hide your username from websites</div>","b. To require more than one method of verifying your identity"],
["Which of these is an example of social engineering?<div class='choices'>a. Someone pretending to be IT support to convince you to reveal your password<br>b. A firewall blocking an unauthorized connection<br>c. Encrypting a file before sending it</div>","a. Someone pretending to be IT support to convince you to reveal your password"],
["Which type of malware typically encrypts a victim's files and demands payment?<div class='choices'>a. Spyware<br>b. Ransomware<br>c. Adware</div>","b. Ransomware"],
["What is the primary purpose of a firewall?<div class='choices'>a. To create stronger passwords<br>b. To automatically remove all viruses<br>c. To monitor and control network traffic based on security rules</div>","c. To monitor and control network traffic based on security rules"]],
hard:[
["What does ‘integrity’ refer to in the CIA triad?","Integrity refers to ensuring that data remains accurate, complete, and unaltered except through authorized changes.<ul><li>Making sure nobody changes the data without permission.</li><li>Ensuring information stays accurate.</li><li>Making sure data hasn't been tampered with.</li><li>Protecting data from unauthorized modification.</li></ul>"],
["What is the difference between encryption and hashing?","Encryption transforms information into an unreadable form that can be reversed with the appropriate key. Hashing uses a one-way function to generate a fixed-size digest and is not designed to be reversed.<ul><li>Encryption → reversible, key, decrypt/decryption, confidentiality</li><li>Hashing → one-way, digest/hash, integrity, password verification</li></ul>"],
["What is the principle of least privilege?","A user, program, or system should receive only the minimum permissions needed to perform its required tasks."],
["What is a zero-day vulnerability?","A security vulnerability that is unknown to the vendor/developer or does not yet have a fix available, leaving little or no time to patch before it may be exploited.<ul><li>A vulnerability that doesn't have a patch yet.</li><li>A newly discovered vulnerability attackers can exploit.</li><li>A vulnerability the developer didn't know about.</li></ul>"]]},
"Cloud":{
easy:[
["True or False: Cloud computing allows users to access computing resources such as servers and storage over a network such as the internet.","TRUE"],
["True or False: Files stored in the cloud must also be stored on your personal computer.","FALSE"],
["True or False: Google Drive is an example of a cloud-based service.","TRUE"],
["True or False: Cloud computing means that there are no physical servers involved.","FALSE"]],
medium:[
["Which cloud service model provides virtual machines, storage, and networking resources?<div class='choices'>a. SaaS<br>b. PaaS<br>c. IaaS</div>","c. IaaS"],
["Which of the following is an example of Software as a Service (SaaS)?<div class='choices'>a. Google Docs<br>b. A physical server<br>c. An Ethernet switch</div>","a. Google Docs"],
["What does \"scalability\" mean in cloud computing?<div class='choices'>a. Encrypting data before uploading it<br>b. Increasing or decreasing computing resources to meet demand<br>c. Moving a server into a larger building</div>","b. Increasing or decreasing computing resources to meet demand"],
["Which cloud deployment model combines public cloud resources with private infrastructure?<div class='choices'>a. Community cloud<br>b. Distributed cloud<br>c. Hybrid cloud</div>","c. Hybrid cloud"]],
hard:[
["What is the difference between IaaS, PaaS, and SaaS?","IaaS — Infrastructure as a Service: Provides infrastructure such as virtual machines, networking, and storage.<br><br>PaaS — Platform as a Service: Provides a managed platform/environment for developing and deploying applications.<br><br>SaaS — Software as a Service: Provides complete applications that users access without managing the underlying infrastructure."],
["What is the difference between scalability and elasticity in cloud computing?","Scalability is the ability of a system to increase or decrease its capacity to accommodate workload. Elasticity refers to dynamically adjusting resources in response to changing demand, often automatically.<ul><li>Scalability → increase/decrease capacity, growth, resources</li><li>Elasticity → dynamic, automatic, demand, scale up/down</li><li>Resource allocation</li><li>Workload</li></ul>"],
["What is virtualization, and why is it useful in cloud computing?","Virtualization allows multiple virtual machines or environments to run on physical hardware while behaving like separate systems. It allows cloud providers to use physical computing resources more efficiently and allocate them flexibly.<ul><li>It lets multiple virtual computers run on one physical server.</li><li>A hypervisor divides hardware resources between virtual machines.</li></ul>"],
["What term describes automatically increasing or decreasing cloud resources based on demand?","Elasticity<br>★ Auto-scaling"]]},
"Coding":{
easy:[
["True or False: A variable is used to store data in a program.","True"],["True or False: In Python, print() is used to display output on the screen.","True"],["True or False: An if statement is used to repeat code multiple times.","False<br><br>An if statement is used to make decisions based on a condition."],["True or False: A loop can be used to run the same block of code multiple times.","True"]],
medium:[
["What is the output of the following Python code?<div class='choices'><code>x = 5<br>y = 2<br>print(x // y)</code><br><br>A. 2.5<br>B. 2<br>C. 3<br>D. 2.0</div>","B. 2"],
["Which data structure is best suited for storing key-value pairs?<div class='choices'>A. List<br>B. Tuple<br>C. Dictionary<br>D. Set</div>","C. Dictionary"],
["What does the break statement do inside a loop?<div class='choices'>A. Skips the current iteration<br>B. Stops the loop completely<br>C. Restarts the loop<br>D. Pauses the program</div>","B. Stops the loop completely"],
["What is the main purpose of a function in programming?<div class='choices'>A. To permanently store data<br>B. To repeat the entire program<br>C. To group reusable code that performs a specific task<br>D. To create comments in the code</div>","C. To group reusable code that performs a specific task"]],
hard:[
["A program becomes much slower as the amount of data increases. How would you identify and fix the performance problem?","<ul><li>Use a profiler to identify which functions consume the most CPU time or memory.</li><li>Analyze the algorithm’s time complexity and replace inefficient algorithms, such as an O(n²) algorithm, with an O(n log n) or O(n) approach.</li><li>Replace inefficient data structures with more suitable ones, such as using a hash table instead of repeatedly searching a list.</li><li>Reduce unnecessary loops, calculations, database queries, or repeated file operations.</li><li>Use caching when the program repeatedly calculates or retrieves the same information.</li></ul>"],
["How would you prevent multiple threads from incorrectly modifying the same shared variable at the same time?","<ul><li>Use a mutex or lock so only one thread can access the shared resource at a time.</li><li>Use thread-safe data structures.</li><li>Use atomic operations when supported by the programming language.</li><li>Reduce or eliminate shared mutable data between threads.</li><li>Use message passing or queues so threads communicate without directly changing the same data.</li></ul>"],
["You need to process millions of records but cannot load all of them into memory at once. How could you design the program?","<ul><li>Process the records in smaller batches or chunks.</li><li>Use generators, iterators, or streams to process one record at a time.</li><li>Read database results using pagination rather than retrieving the entire dataset.</li><li>Write intermediate results to a file or database instead of keeping everything in memory.</li><li>Use distributed processing tools when the dataset is too large for one machine.</li></ul>"],
["A function produces the correct result most of the time but occasionally returns incorrect results. How would you debug the problem?","<ul><li>Create automated tests that repeatedly reproduce the conditions causing the error.</li><li>Add logging to track variable values, inputs, outputs, and program execution.</li><li>Use a debugger with breakpoints to examine the program state.</li><li>Check for race conditions, unexpected input, incorrect assumptions, or boundary cases.</li><li>Create unit tests for edge cases such as empty inputs, very large values, duplicate data, or invalid values.</li><li>Review external dependencies such as APIs, databases, files, or network connections that may produce inconsistent results.</li></ul>"]]},
"Networking":{
easy:[
["True or False: A router connects different networks together.","True"],["True or False: An IP address is used to identify a device on a network.","True"],["True or False: Wi-Fi requires an Ethernet cable to connect every device.","False"],["True or False: A switch is commonly used to connect multiple devices within the same LAN.","True"]],
medium:[
["Which protocol automatically assigns IP addresses to devices on a network?<div class='choices'>A. DNS<br>B. FTP<br>C. DHCP<br>D. HTTP</div>","C. DHCP"],
["What is the main purpose of DNS?<div class='choices'>A. Encrypt network traffic<br>B. Translate domain names into IP addresses<br>C. Assign MAC addresses<br>D. Connect switches together</div>","B. Translate domain names into IP addresses"],
["Which OSI layer is responsible for IP addressing and routing?<div class='choices'>A. Layer 1 – Physical<br>B. Layer 2 – Data Link<br>C. Layer 3 – Network<br>D. Layer 4 – Transport</div>","C. Layer 3 – Network"],
["What is the purpose of a subnet mask?<div class='choices'>A. To identify the network and host portions of an IP address<br>B. To encrypt an IP address<br>C. To assign MAC addresses<br>D. To increase Internet speed</div>","A. To identify the network and host portions of an IP address"]],
hard:[
["A user can successfully ping a server by IP address, but cannot access it using its hostname. What could be causing the problem?","<ul><li>The DNS server may be unavailable.</li><li>The client may have an incorrect DNS server configured.</li><li>The DNS record for the server may be missing or incorrect.</li><li>A firewall may be blocking DNS traffic on port 53.</li><li>The client's DNS cache may contain an outdated or incorrect record.</li></ul>Because IP connectivity works while hostname resolution fails, DNS is one of the first areas to investigate."],
["Devices in VLAN 10 can communicate with each other, and devices in VLAN 20 can communicate with each other, but VLAN 10 cannot communicate with VLAN 20. What could explain this?","<ul><li>Inter-VLAN routing has not been configured.</li><li>The router or Layer 3 switch interfaces may have incorrect IP addresses.</li><li>The devices may have incorrect default gateways.</li><li>An ACL or firewall rule may block communication between the VLANs.</li><li>The VLAN trunk between switches may be incorrectly configured.</li><li>One of the VLANs may not be allowed across the trunk.</li></ul>Troubleshooting VLAN problems often requires checking Layer 2 configuration first and then Layer 3 routing."],
["Users report that a network connection works normally at first but becomes extremely slow during busy periods. How would you investigate the problem?","<ul><li>Check interface utilization for network congestion.</li><li>Look for dropped packets, errors, or overloaded interfaces.</li><li>Use packet captures with Wireshark to analyze traffic patterns.</li><li>Check router and switch CPU and memory usage.</li><li>Look for excessive broadcast or multicast traffic.</li><li>Check for duplex or speed mismatches.</li><li>Use ping and traceroute to identify latency or packet loss.</li><li>Determine if one application or device is consuming excessive bandwidth.</li></ul>Packet captures and hop-by-hop testing can help isolate where performance problems occur."],
["A company has two routers providing paths to the same destination network. How could you design the network so that connectivity continues if one router fails?","<ul><li>Use a dynamic routing protocol such as OSPF to automatically select another available route.</li><li>Configure a primary static route and a floating static route as backup.</li><li>Use HSRP or VRRP to provide redundant default gateways for users.</li><li>Use redundant physical connections between important network devices.</li><li>Configure routing metrics so one path acts as the primary path and another as a backup.</li><li>Use equal-cost routes if traffic should use multiple available paths.</li></ul>A strong answer should also explain how the network detects the failure and switches to the alternate path, rather than only naming a redundancy technology."]]
}}
const ids={"Cyber Security":"cyber","Cloud":"cloud","Coding":"coding","Networking":"networking"};
const app=document.getElementById('app');
Object.entries(data).forEach(([topic,levels])=>{let s=document.createElement('section');s.className='topic';s.id=ids[topic];s.innerHTML=`<h2>${topic}</h2><div class="columns"></div>`;let cols=s.querySelector('.columns');['easy','medium','hard'].forEach(level=>{let c=document.createElement('div');c.className=`level ${level}`;c.innerHTML=`<h3>${level.toUpperCase()}</h3>`;levels[level].forEach((card,i)=>{let n=level==='easy'?i+1:level==='medium'?i+5:i+9;c.innerHTML+=`<div class="flashcard" tabindex="0" role="button" aria-label="Flip question ${n}"><div class="inner"><div class="face front"><div class="qnum">QUESTION ${n}</div><div class="question">${card[0]}</div><div class="hint">Tap to reveal answer</div></div><div class="face back"><div class="qnum">ANSWER ${n}</div><div class="answer">${card[1]}</div><div class="hint">Tap to return to question</div></div></div></div>`});cols.appendChild(c)});app.appendChild(s)});
document.querySelectorAll('.flashcard').forEach(c=>{const flip=()=>c.classList.toggle('flipped');c.addEventListener('click',flip);c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}})});
</script></body></html>
